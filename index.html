<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas Pendientes</title>
    <link rel="stylesheet" href="sty.css">
</head>
<body>


<h1 class="titulo-principal">Todo App</h1>

<div class="tarjeta">
  <div class="contenedor-input">
    <input type="text" placeholder="Escribe una nueva tarea..." class="input-tarea">
    <button class="boton-agregar">+</button>
  </div>

  <ul class="lista-tareas">
    <li class="item-tarea">
      <button class="btn-eliminar">✕</button>
      <span class="texto-tarea">Pasear al perro</span>
      <input type="checkbox" class="check-completado">
    </li>

    <li class="item-tarea">
      <button class="btn-eliminar">✕</button>
      <span class="texto-tarea">Sacar la basura</span>
      <input type="checkbox" class="check-completado">
    </li>

    <li class="item-tarea">
      <button class="btn-eliminar">✕</button>
      <span class="texto-tarea">Terminar la tarea</span>
      <input type="checkbox" class="check-completado">
    </li>
    <li class="item-tarea">
  <button class="btn-eliminar">✕</button>
  <span class="texto-tarea">Esta es una tarea con un texto bastante largo para probar que no se rompa el diseño</span>
  <input type="checkbox" class="check-completado">
</li>
  </ul>
</div>


</body>
</html>
